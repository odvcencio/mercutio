name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: make test
      - name: Verify tagged substrate dependencies
        run: make dependency-check
      - name: Enforce privileged module boundaries
        run: make module-boundary-check
      - name: Race-sensitive state and transport tests
        run: make race
      - name: Vet
        run: make vet
      - name: Build
        run: make build
      - name: Verify generated enforcement artifacts
        run: make nodeagent-check-generated
      - name: Verify governed profile artifacts
        run: make profile-check
      - name: Enforce GoSX-only product UI
        run: test -z "$(find . -path './.git' -prune -o -name '*.js' -print)"
      - uses: azure/setup-helm@v4
      - name: Validate Helm deployment
        run: make helm-check helm-manifest-check
      - name: GoSX browser end-to-end
        run: make browser-e2e

  deployment-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - name: Install and inspect class-isolated deployment
        run: ./scripts/kind-smoke.sh
