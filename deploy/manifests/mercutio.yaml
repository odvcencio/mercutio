# Source: mercutio/templates/sandbox-template.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mercutio-mercutio-sandbox-template
  labels:
    app.kubernetes.io/name: mercutio
    app.kubernetes.io/instance: mercutio
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
data:
  pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        mercutio.dev/managed: "true"
        mercutio.dev/cell-id: "{{CELL_ID}}"
        mercutio.m31labs.dev/component: cell
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      activeDeadlineSeconds: 14400
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-agent-supervisor
          image: example.invalid/mercutio@sha256:1111111111111111111111111111111111111111111111111111111111111111
          command: ["/bin/sh", "-c"]
          args: ["cp /app/mercutio /run/mercutio/mercutio && chmod 0555 /run/mercutio/mercutio"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /run/mercutio
        - name: materialize-graft-worktree
          image: example.invalid/graft@sha256:1111111111111111111111111111111111111111111111111111111111111111
          args: ["clone", "--branch", "{{BRANCH}}", "--no-modules", "{{REPO_URL}}", "/workspace/repo"]
          securityContext: *restricted
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: scratch
              mountPath: /tmp
        - name: report-workspace-device
          image: example.invalid/mercutio@sha256:1111111111111111111111111111111111111111111111111111111111111111
          args: ["workspace-probe", "--cell", "{{CELL_ID}}", "--control", "http://mercutio-mercutio.default.svc:9011", "--workspace", "/workspace/repo", "--scratch", "/tmp", "--runtime", "/run/mercutio"]
          securityContext: *restricted
          env:
            - name: MERCUTIO_ARM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "{{ARM_SECRET_REF}}"
                  key: token
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: scratch
              mountPath: /tmp
            - name: runtime
              mountPath: /run/mercutio
        - name: armgate
          image: example.invalid/mercutio@sha256:1111111111111111111111111111111111111111111111111111111111111111
          args: ["armgate", "--cell", "{{CELL_ID}}", "--control", "http://mercutio-mercutio.default.svc:9011", "--output", "/run/mercutio/armed"]
          securityContext: *restricted
          env:
            - name: MERCUTIO_ARM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "{{ARM_SECRET_REF}}"
                  key: token
          volumeMounts:
            - name: runtime
              mountPath: /run/mercutio
            - name: scratch
              mountPath: /tmp
      containers:
        - name: agent
          image: example.invalid/agent@sha256:1111111111111111111111111111111111111111111111111111111111111111
          command: ["/run/mercutio/mercutio"]
          args:
            - agent
            - --adapter
            - "claude-code"
            - --socket
            - /run/mercutio/attach.sock
            - --worktree
            - /workspace/repo
            - --
            - "claude"
            - "--print"
            - "--input-format"
            - "stream-json"
            - "--output-format"
            - "stream-json"
          securityContext: *restricted
          workingDir: /workspace/repo
          env:
            - name: MERCUTIO_CELL_ID
              value: "{{CELL_ID}}"
            - name: MERCUTIO_ATTACH_SOCKET
              value: /run/mercutio/attach.sock
            - name: MERCUTIO_SANDBOX_PROFILE
              value: "{{PROFILE}}"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: runtime
              mountPath: /run/mercutio
            - name: scratch
              mountPath: /tmp
        - name: attach
          image: example.invalid/mercutio@sha256:1111111111111111111111111111111111111111111111111111111111111111
          args: ["attach", "--cell", "{{CELL_ID}}", "--hub", "{{HUB_URL}}", "--adapter", "claude-code", "--socket", "/run/mercutio/attach.sock", "--worktree", "/workspace/repo"]
          securityContext: *restricted
          env:
            - name: MERCUTIO_ATTACH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "{{ATTACH_SECRET_REF}}"
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: runtime
              mountPath: /run/mercutio
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: scratch
          emptyDir:
            sizeLimit: 256Mi
