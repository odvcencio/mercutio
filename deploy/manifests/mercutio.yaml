    metadata:
      labels:
        app.kubernetes.io/name: mercutio-nodeagent
        app.kubernetes.io/instance: mercutio
        app.kubernetes.io/component: nodeagent
    spec:
      serviceAccountName: mercutio-mercutio-nodeagent
      automountServiceAccountToken: false
      hostPID: false
      hostNetwork: false
      hostIPC: false
      containers:
        - name: nodeagent
          image: "ghcr.io/odvcencio/mercutio-nodeagent@sha256:1111111111111111111111111111111111111111111111111111111111111111"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            capabilities:
              drop: [ALL]
              add: [BPF, PERFMON, NET_ADMIN, SYS_RESOURCE]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MERCUTIO_CONTROL_URL
              value: "https://mercutio-mercutio.default.svc:9443"
            - name: MERCUTIO_EVENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mercutio-event-token
                  key: token
                  optional: false
            - name: MERCUTIO_HORIZON_MANIFEST
              value: "/usr/share/mercutio/programs/mercutio.cap.json"
            - name: MERCUTIO_HORIZON_OBJECT
              value: "/usr/share/mercutio/programs/mercutio.bpf.o"
            - name: MERCUTIO_HORIZON_PINS
              value: /etc/mercutio/trust/pins.json
            - name: MERCUTIO_HORIZON_PUBLIC_KEYS
              value: /etc/mercutio/trust/public-keys.json
            - name: MERCUTIO_MTLS_CERT
              value: /etc/mercutio/mtls/tls.crt
            - name: MERCUTIO_MTLS_KEY
              value: /etc/mercutio/mtls/tls.key
            - name: MERCUTIO_MTLS_CA
              value: /etc/mercutio/mtls/ca.crt
            - name: MERCUTIO_BASE_EGRESS
              value: "mercutio-mercutio.default.svc:9443,kube-dns.kube-system.svc.cluster.local:53"
          ports:
            - name: health
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: trust
              mountPath: /etc/mercutio/trust
              readOnly: true
            - name: mtls
              mountPath: /etc/mercutio/mtls
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: trust
          secret:
            secretName: mercutio-horizon-trust
            optional: false
        - name: mtls
          secret:
            secretName: mercutio-nodeagent-client-tls
            optional: false
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
