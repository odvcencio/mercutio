# Source: mercutio/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercutio-mercutio
  labels:
    app.kubernetes.io/name: mercutio
    app.kubernetes.io/instance: mercutio
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mercutio
      app.kubernetes.io/instance: mercutio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mercutio
        app.kubernetes.io/instance: mercutio
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.1.0"
    spec:
      serviceAccountName: mercutio-mercutio
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mercutio
          image: "ghcr.io/odvcencio/mercutio@sha256:1111111111111111111111111111111111111111111111111111111111111111"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9011
            - name: internal-mtls
              containerPort: 9443
          env:
            - name: MERCUTIO_PORT
              value: "9011"
            - name: MERCUTIO_DEV_MODE
              value: "0"
            - name: MERCUTIO_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mercutio-operator-token
                  key: token
                  optional: true
            - name: MERCUTIO_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: mercutio-session-secret
                  key: secret
                  optional: true
            - name: MERCUTIO_EVENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mercutio-event-token
                  key: token
                  optional: true
            - name: MERCUTIO_CAPABILITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: mercutio-capability-secret
                  key: secret
                  optional: false
            - name: MERCUTIO_COMMITTER
              value: "agent"
            - name: MERCUTIO_SANDBOX_RUNTIME
              value: "kubernetes"
            - name: MERCUTIO_NAMESPACE
              value: "default"
            - name: MERCUTIO_STRICT_NAMESPACE
              value: "mercutio-cell-strict"
            - name: MERCUTIO_STANDARD_NAMESPACE
              value: "mercutio-cell-standard"
            - name: MERCUTIO_OPEN_NAMESPACE
              value: "mercutio-cell-open"
            - name: MERCUTIO_SANDBOX_TEMPLATE
              value: "mercutio-mercutio-sandbox-template"
            - name: MERCUTIO_HUB_URL
              value: "http://mercutio-mercutio.default.svc:9011/gosx/hub/agent"
            - name: MERCUTIO_EVIDENCE_PATH
              value: /var/lib/mercutio/evidence.jsonl
            - name: MERCUTIO_STATE_PATH
              value: /var/lib/mercutio/state.json
            - name: MERCUTIO_INTERNAL_TLS_ADDR
              value: ":9443"
            - name: MERCUTIO_INTERNAL_TLS_CERT
              value: /etc/mercutio/internal-tls/tls.crt
            - name: MERCUTIO_INTERNAL_TLS_KEY
              value: /etc/mercutio/internal-tls/tls.key
            - name: MERCUTIO_INTERNAL_TLS_CLIENT_CA
              value: /etc/mercutio/internal-tls/ca.crt
          volumeMounts:
            - name: evidence
              mountPath: /var/lib/mercutio
            - name: scratch
              mountPath: /tmp
            - name: internal-tls
              mountPath: /etc/mercutio/internal-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            limits:
              cpu: 1
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: mercutio-mercutio-evidence
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
        - name: internal-tls
          secret:
            secretName: mercutio-internal-server-tls
            optional: false
