apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mercutio.fullname" . }}
  labels:
    {{- include "mercutio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mercutio.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "mercutio.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mercutio.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mercutio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9011
          env:
            - name: MERCUTIO_PORT
              value: "9011"
            - name: MERCUTIO_DEV_MODE
              value: {{ .Values.operator.devMode | quote }}
            - name: MERCUTIO_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.tokenSecret.name }}
                  key: {{ .Values.operator.tokenSecret.key }}
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
