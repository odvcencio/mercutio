{{- if .Values.sandbox.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mercutio.fullname" . }}-sandbox-reconciler
  labels:
    {{- include "mercutio.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "secrets"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mercutio.fullname" . }}-sandbox-reconciler
  labels:
    {{- include "mercutio.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mercutio.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "mercutio.fullname" . }}-sandbox-reconciler
  apiGroup: rbac.authorization.k8s.io
{{- end }}
