{{- if .Values.sandbox.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mercutio.fullname" . }}-sandbox-reconciler
  labels:
    {{- include "mercutio.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mercutio.fullname" . }}-sandbox-reconciler
  labels:
    {{- include "mercutio.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mercutio.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "mercutio.fullname" . }}-sandbox-reconciler
  apiGroup: rbac.authorization.k8s.io
{{- range $profile := list "strict" "standard" "open" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mercutio.fullname" $ }}-sandbox-reconciler
  namespace: {{ index $.Values.cellNamespaces $profile }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["mercutio.dev"]
    resources: ["cells", "cells/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mercutio.fullname" $ }}-sandbox-reconciler
  namespace: {{ index $.Values.cellNamespaces $profile }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mercutio.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "mercutio.fullname" $ }}-sandbox-reconciler
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
