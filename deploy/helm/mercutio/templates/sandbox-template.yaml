{{- if .Values.sandbox.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mercutio.fullname" . }}-sandbox-template
  labels:
    {{- include "mercutio.labels" . | nindent 4 }}
data:
  pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        mercutio.dev/managed: "true"
        mercutio.dev/cell-id: "{{`{{CELL_ID}}`}}"
        mercutio.m31labs.dev/component: cell
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      activeDeadlineSeconds: {{ .Values.sandbox.activeDeadlineSeconds }}
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-agent-supervisor
          image: {{ .Values.sandbox.attachImage }}
          command: ["/bin/sh", "-c"]
          args: ["cp /app/mercutio /run/mercutio/mercutio && chmod 0555 /run/mercutio/mercutio"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /run/mercutio
        - name: materialize-graft-worktree
          image: {{ .Values.sandbox.graftImage }}
          args: ["clone", "--branch", "{{`{{BRANCH}}`}}", "--no-modules", "{{`{{REPO_URL}}`}}", "/workspace/repo"]
          securityContext: *restricted
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: scratch
              mountPath: /tmp
        - name: armgate
          image: {{ .Values.sandbox.armgateImage }}
          args: ["armgate", "--cell", "{{`{{CELL_ID}}`}}", "--control", "http://{{ include "mercutio.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}", "--output", "/run/mercutio/armed"]
          securityContext: *restricted
          env:
            - name: MERCUTIO_ARM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "{{`{{ARM_SECRET_REF}}`}}"
                  key: token
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: runtime
              mountPath: /run/mercutio
            - name: scratch
              mountPath: /tmp
      containers:
        - name: agent
          image: {{ .Values.sandbox.agentImage }}
          command: ["/run/mercutio/mercutio"]
          args:
            - agent
            - --adapter
            - {{ .Values.sandbox.agentAdapter | quote }}
            - --socket
            - /run/mercutio/attach.sock
            - --worktree
            - /workspace/repo
            - --
            {{- range .Values.sandbox.agentCommand }}
            - {{ . | quote }}
            {{- end }}
          securityContext: *restricted
          workingDir: /workspace/repo
          env:
            - name: MERCUTIO_CELL_ID
              value: "{{`{{CELL_ID}}`}}"
            - name: MERCUTIO_ATTACH_SOCKET
              value: /run/mercutio/attach.sock
            - name: MERCUTIO_SANDBOX_PROFILE
              value: "{{`{{PROFILE}}`}}"
          resources:
            requests:
              cpu: {{ .Values.sandbox.cpuRequest | quote }}
              memory: {{ .Values.sandbox.memoryRequest | quote }}
            limits:
              cpu: {{ .Values.sandbox.cpuLimit | quote }}
              memory: {{ .Values.sandbox.memoryLimit | quote }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: runtime
              mountPath: /run/mercutio
            - name: scratch
              mountPath: /tmp
        - name: attach
          image: {{ .Values.sandbox.attachImage }}
          args: ["attach", "--cell", "{{`{{CELL_ID}}`}}", "--hub", "{{`{{HUB_URL}}`}}", "--adapter", {{ .Values.sandbox.agentAdapter | quote }}, "--socket", "/run/mercutio/attach.sock", "--worktree", "/workspace/repo"]
          securityContext: *restricted
          env:
            - name: MERCUTIO_ATTACH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "{{`{{ATTACH_SECRET_REF}}`}}"
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: runtime
              mountPath: /run/mercutio
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sandbox.workspaceSizeLimit | quote }}
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: scratch
          emptyDir:
            sizeLimit: 256Mi
{{- end }}
