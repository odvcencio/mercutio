{{- if and .Values.sandbox.enabled .Values.networkPolicy.enabled }}
{{- range $namespaceProfile := list "strict" "standard" "open" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mercutio.fullname" $ }}-default-deny-all
  namespace: {{ index $.Values.cellNamespaces $namespaceProfile }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mercutio.fullname" $ }}-control-and-dns
  namespace: {{ index $.Values.cellNamespaces $namespaceProfile }}
spec:
  podSelector:
    matchLabels:
      mercutio.dev/managed: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "mercutio.name" $ }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        - {protocol: TCP, port: {{ $.Values.service.port }}}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mercutio.fullname" $ }}-standard-egress
  namespace: {{ index $.Values.cellNamespaces $namespaceProfile }}
spec:
  podSelector:
    matchLabels:
      mercutio.dev/managed: "true"
      mercutio.dev/network-profile: standard
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range $.Values.networkPolicy.protectedIPv4CIDRs }}
              - {{ . | quote }}
              {{- end }}
              - {{ $.Values.networkPolicy.kubernetesAPICIDR | quote }}
        - ipBlock:
            cidr: ::/0
            except:
              {{- range $.Values.networkPolicy.protectedIPv6CIDRs }}
              - {{ . | quote }}
              {{- end }}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mercutio.fullname" $ }}-open-egress
  namespace: {{ index $.Values.cellNamespaces $namespaceProfile }}
spec:
  podSelector:
    matchLabels:
      mercutio.dev/managed: "true"
      mercutio.dev/network-profile: open
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range $.Values.networkPolicy.protectedIPv4CIDRs }}
              - {{ . | quote }}
              {{- end }}
              - {{ $.Values.networkPolicy.kubernetesAPICIDR | quote }}
        - ipBlock:
            cidr: ::/0
            except:
              {{- range $.Values.networkPolicy.protectedIPv6CIDRs }}
              - {{ . | quote }}
              {{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mercutio.fullname" . }}-nodeagent-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: nodeagent
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "mercutio.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {protocol: TCP, port: {{ .Values.internalTLS.port }}}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: {{ .Values.networkPolicy.kubernetesAPICIDR | quote }}}
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
