apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cells.mercutio.dev
spec:
  group: mercutio.dev
  scope: Namespaced
  names:
    plural: cells
    singular: cell
    kind: Cell
    shortNames: [mcell]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .spec.profile
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Armed
          type: boolean
          jsonPath: .status.armed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [cellID, repoURL, profile]
              properties:
                cellID:
                  type: string
                  minLength: 1
                repoURL:
                  type: string
                  minLength: 1
                branch:
                  type: string
                  default: main
                profile:
                  type: string
                  enum: [strict, standard, open]
                profileDigest:
                  type: string
                podTemplateRef:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [pending, running, stopped, failed]
                podName:
                  type: string
                nodeName:
                  type: string
                armed:
                  type: boolean
                enforcement:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                lastTransitionTime:
                  type: string
                  format: date-time
