[project]
name = "mercutio-cell-standard"
[policy]
bundle = "standard.arb"
[subject]
default_kind = "agent"
default_mode = "ask"
[capabilities]
horizon_manifest_dir = "/usr/share/mercutio/programs"
manifest_signature_mode = "require"
manifest_digest_pins = "/etc/mercutio/trust/pins.json"
[enforcement]
network = "enforce"
file = "enforce"
process = "enforce"
[approval]
kind = "hub"
